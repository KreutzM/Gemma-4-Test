version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      android-gradle:
        patterns:
          - com.android.application
          - com.android.tools.*
      kotlin:
        patterns:
          - org.jetbrains.kotlin*
      androidx:
        patterns:
          - androidx.*
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
