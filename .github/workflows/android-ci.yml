name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-wrapper:
    name: Validate Gradle Wrapper
    runs-on: ubuntu-latest
    if: hashFiles('gradle/wrapper/gradle-wrapper.jar') != ''
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate wrapper
        uses: gradle/actions/wrapper-validation@v4

  build-test-lint:
    name: Build, unit test, lint
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate Gradle Wrapper if missing
        run: |
          if [ ! -x ./gradlew ]; then
            gradle wrapper --gradle-version 8.10.2 --distribution-type bin
          fi

      - name: Make Gradle Wrapper executable
        run: chmod +x ./gradlew

      - name: Check formatting with ktlint when configured
        run: |
          if ./gradlew tasks --all | grep -q '^ktlintCheck'; then
            ./gradlew ktlintCheck --stacktrace
          else
            echo "ktlint is not configured yet; skipping. See docs/quality.md."
          fi

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Run Android lint
        run: ./gradlew lintDebug --stacktrace

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-reports
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: gemma4test-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
