name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-wrapper:
    name: Validate Gradle Wrapper
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate wrapper
        if: hashFiles('gradle/wrapper/gradle-wrapper.jar') != ''
        uses: gradle/actions/wrapper-validation@v4
      - name: Skip wrapper validation when wrapper is absent
        if: hashFiles('gradle/wrapper/gradle-wrapper.jar') == ''
        run: echo "Gradle Wrapper is not committed yet; build job will bootstrap it."

  build-test-lint:
    name: Build, unit test, lint
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Generate Gradle Wrapper if missing or incomplete
        run: |
          if [ ! -x ./gradlew ] || [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version 8.10.2 --distribution-type bin
          fi

      - name: Make Gradle Wrapper executable
        run: chmod +x ./gradlew

      - name: Check formatting with ktlint when configured
        run: |
          if ./gradlew tasks --all | grep -q '^ktlintCheck'; then
            ./gradlew ktlintCheck --stacktrace --no-daemon
          else
            echo "ktlint is not configured yet; skipping. See docs/quality.md."
          fi

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace --no-daemon

      - name: Run Android lint
        run: ./gradlew lintDebug --stacktrace --no-daemon

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload lint report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 1

      - name: Upload unit test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore
          retention-days: 1

      - name: Upload debug APK for manual runs only
        if: success() && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: gemma4test-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 1
